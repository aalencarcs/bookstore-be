name: Build and Push Image
on: [ push ]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buldx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          config-inline: |
            [registry."localhost:5100"]
              http = true
      - name: Log message
        run: |
          echo 'Image it is done'

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: localhost:5100/aipaipara/myapp2:S100