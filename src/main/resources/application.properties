spring.application.name=test
spring.datasource.url=jdbc:postgresql://${db_address:localhost}:${db_port:5432}/${db_name:test_db}
spring.datasource.username=${db_user:test_user}
spring.datasource.password=${password:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.liquibase.change-log=changelog-master.yaml

server.servlet.context-path=/test
server.port=8080